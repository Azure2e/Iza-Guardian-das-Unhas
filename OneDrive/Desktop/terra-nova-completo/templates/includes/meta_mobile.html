{% load static %}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1711" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0E1711">
<meta name="application-name" content="TERRA NOVA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TERRA NOVA">
<meta name="format-detection" content="telephone=yes, email=yes, address=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="msapplication-TileColor" content="#0E1711">
<meta name="msapplication-TileImage" content="{% static 'img/icon-180.png' %}">
<meta name="msapplication-tap-highlight" content="no">
<meta name="description" content="{% block meta_description %}{{ meta_description|default:'Clínica e farmácia veterinária TERRA NOVA. Produtos, carrinho seguro e pagamento PIX.' }}{% endblock %}">
<meta property="og:locale" content="pt_BR">
<meta property="og:type" content="website">
<meta property="og:site_name" content="TERRA NOVA Veterinária">
<meta property="og:title" content="{% block og_title %}{% firstof page_title clinic_name 'TERRA NOVA Veterinária' %}{% endblock %}">
<meta property="og:description" content="{{ meta_description|default:'Farmácia veterinária TERRA NOVA. App, PIX e atendimento.' }}">
<meta property="og:image" content="{% static 'img/icon-512.png' %}">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="TERRA NOVA Veterinária">
<meta name="twitter:description" content="{{ meta_description|default:'Produtos veterinários, app e PIX.' }}">
<meta name="twitter:image" content="{% static 'img/icon-512.png' %}">
{% if request %}
<link rel="canonical" href="{{ request.build_absolute_uri }}">
<meta property="og:url" content="{{ request.build_absolute_uri }}">
{% endif %}
<link rel="icon" href="{% static 'img/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'img/icon-180.png' %}">
<link rel="apple-touch-icon" sizes="120x120" href="{% static 'img/icon-120.png' %}">
<link rel="apple-touch-icon" sizes="152x152" href="{% static 'img/icon-152.png' %}">
<link rel="apple-touch-icon" sizes="167x167" href="{% static 'img/icon-167.png' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/icon-180.png' %}">
<link rel="manifest" href="{% static 'app/manifest.webmanifest' %}">
