{% extends 'painel/base_painel.html' %}
{% block painel %}
<h1>{% if product %}Editar{% else %}Novo{% endif %} produto</h1>
<form method="post" class="card form-grid" style="max-width:720px">
  {% csrf_token %}
  <div class="row-2">
    <div><label>Nome</label><input name="name" required value="{{ product.name|default:'' }}"></div>
    <div><label>Emoji</label><input name="emoji" value="{{ product.emoji|default:'🦴' }}"></div>
  </div>
  <div><label>Descrição</label><textarea name="description" rows="4" required>{{ product.description|default:'' }}</textarea></div>
  <div class="row-2">
    <div><label>Preço (R$)</label><input name="price" type="number" step="0.01" value="{{ product.price|default:'0' }}"></div>
    <div><label>Estoque</label><input name="stock" type="number" value="{{ product.stock|default:'0' }}"></div>
  </div>
  <div><label>Categoria</label>
    <select name="category">
      {% for c in categories %}
        <option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
  </div>
  <label><input type="checkbox" name="featured" {% if product.featured %}checked{% endif %} style="width:auto"> Mais relevante</label>
  <label><input type="checkbox" name="active" {% if product.active or not product %}checked{% endif %} style="width:auto"> Ativo na loja</label>
  <button class="btn btn-cana" type="submit">Salvar</button>
</form>
{% endblock %}
