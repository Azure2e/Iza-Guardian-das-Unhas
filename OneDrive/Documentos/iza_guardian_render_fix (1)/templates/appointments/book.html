{% extends 'base.html' %}

{% block title %}Agendar - Iza Guardian{% endblock %}

{% block content %}
<div class="header">
    <div class="brand">Agendar Horário</div>
</div>

<div class="form-container">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Serviço / Modelo</label>
            <select name="service" required>
                <option value="">Selecione...</option>
                {% for s in services %}
                <option value="{{ s.pk }}" {% if selected_service and selected_service.pk == s.pk %}selected{% endif %}>
                    {{ s.name }} - R$ {{ s.price }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Data</label>
            <input type="date" name="date" required min="{{ today|date:'Y-m-d' }}">
        </div>
        <div class="form-group">
            <label>Horário</label>
            <input type="time" name="time" required>
        </div>
        <div class="form-group">
            <label>Observações (opcional)</label>
            <textarea name="notes" rows="3" placeholder="Alguma preferência especial?"></textarea>
        </div>
        <button type="submit" class="btn-primary" style="background: linear-gradient(90deg, #4a90e2, #357abd); box-shadow: 0 6px 20px rgba(74, 144, 226, 0.45);">Confirmar Agendamento</button>
    </form>
</div>
{% endblock %}
